name = "collab-hub"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Archivos: sin este bloque se guardan en la base de cada sala (alcanza el plan gratuito).
# Opcional, con R2 activado en la cuenta: npx wrangler r2 bucket create collab-files
# y descomentá el bloque; los archivos nuevos van a R2.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "collab-files"

# Límite de pedidos por IP para crear salas, unirse y vistas previas (anti-abuso).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# El MCP remoto (src/mcp.js) incluye el protocolo, que vive en el plugin como Markdown.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
