name = "collab-hub"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Archivos compartidos (opcional, requiere R2 activado en la cuenta). Para habilitarlos:
#   npx wrangler r2 bucket create collab-files
# y descomentá este bloque. Sin él, el hub responde "archivos no habilitados".
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "collab-files"

# Límite de pedidos por IP para crear salas, unirse y vistas previas (anti-abuso).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }
